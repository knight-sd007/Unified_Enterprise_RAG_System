# ==============================================================================
# Cloudflare Tunnel Configuration Template for Portfolio 06 (Enterprise RAG)
# Path on host: /etc/cloudflared/config.yml or ~/.cloudflared/config.yml
# ==============================================================================

# Tunnel UUID (Obtained during 'cloudflared tunnel create <name>')
tunnel: <CLOUDFLARE_TUNNEL_ID>

# Path to Tunnel JSON credentials file on host
credentials-file: /etc/cloudflared/<CLOUDFLARE_TUNNEL_ID>.json

# Ingress Rules Mapping
ingress:
  # Route public subdomain to P06 Streamlit container port
  - hostname: rag.vaikuntrix.in
    service: http://127.0.0.1:8006
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      http2Origin: true

  # Fallback rule for unmapped traffic (Required by Cloudflare Tunnel)
  - service: http_status:404
